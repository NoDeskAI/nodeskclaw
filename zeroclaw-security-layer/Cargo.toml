[package]
name = "zeroclaw-security-layer"
version = "0.1.0"
edition = "2021"
description = "Thin WebSocket client that wraps ZeroClaw tool execution for backend security evaluation"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
async-trait = "0.1"
tracing = "0.1"

# ZeroClaw as path dependency — resolved at Docker build time
# [dependencies.zeroclaw]
# path = "../zeroclaw"

[dev-dependencies]
tracing-subscriber = "0.3"
