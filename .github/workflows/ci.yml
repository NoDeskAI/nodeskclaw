name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Backend Lint (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nodeskclaw-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - name: Check formatting (non-blocking)
        run: ruff format --check .
        continue-on-error: true

  backend-test:
    name: Backend Tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nodeskclaw-backend
    env:
      DEBUG: "true"
      DATABASE_URL: "postgresql+asyncpg://ci:ci@localhost:5432/ci_test"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run pytest tests/ -x -q --tb=short

  portal-typecheck:
    name: Portal Type Check (vue-tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nodeskclaw-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npx vue-tsc --noEmit


  portal-lint:
    name: Portal Lint (ESLint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nodeskclaw-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npx eslint src/

  portal-build:
    name: Portal Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nodeskclaw-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build

  portal-test:
    name: Portal Tests (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nodeskclaw-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Run tests (skip if no test files)
        run: |
          test_count=$(find src -name "*.spec.*" -o -name "*.test.*" 2>/dev/null | wc -l)
          if [ "$test_count" -gt 0 ]; then
            npm run test
          else
            echo "No test files found, skipping"
          fi
