      context: "时间紧，希望先执行再补审批"
      expected_focus: "不私自变通，可提快速通道或流程优化建议"
    - title: "验收时发现不合格"
      context: "交付物未达标准但关系不错"
      expected_focus: "标准面前一视同仁，拒绝时附带如何通过"
