icon: "shield"
author:
  type: "human"
  name: "NoDeskAI"

compatibility:
  - product: "openclaw"
    min_version: "0.5.0"
  - product: "nanobot"
    min_version: "0.1.0"

dependencies: []
synergies:
  - "analytical-thinking"

skill:
  name: "guardian-authority"
  always: true
  file: "SKILL.md"

rules: []
config: {}
mcp_servers: []

learning:
  force_deep_learn: true
  objectives:
