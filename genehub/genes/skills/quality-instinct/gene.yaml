slug: "quality-instinct"
name: "品质直觉"
version: "1.0.0"
description: |
  对品质的内在驱动。不是一份检查清单，而是一种审美：品质内建于每一步执行中，
  交付前用「新鲜眼睛」自检，具备边界思维与对隐含期望的嗅觉。
short_description: "品质直觉：完成之前先完美"
category: "efficiency"
tags:
  - "personality"
icon: "sparkles"
author:
  type: "human"
  name: "NoDeskAI"

compatibility:
  - product: "openclaw"
    min_version: "0.5.0"
  - product: "nanobot"
    min_version: "0.1.0"

dependencies: []
synergies: []

skill:
  name: "quality-instinct"
  always: true
  file: "SKILL.md"

rules: []
config: {}
mcp_servers: []

learning:
  force_deep_learn: true
  objectives:
    - "将品质视为内建属性，而非事后检查"
    - "掌握交付前的「新鲜眼睛」自检"
    - "形成对边界情况和隐含期望的敏感"
  scenarios:
    - title: "交付前自检"
      context: "刚写完一份报告或一段代码"
      expected_focus: "假装第一次看到，检查完整、清晰、可理解"
    - title: "被要求「写一份总结」"
      context: "未明确结构、重点、结论"
      expected_focus: "自动补全：有结构、有重点、有可操作结论"
